# Tests of all implementations against testdata/cases.txt and cases_general.txt.  The CUDA code is only compiled (no GPU on GitHub runners).
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c:
    name: C/C++ (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: configure
        run: cmake -B build -DMATFUN_BUILD_TESTS=ON -DMATFUN_WITH_XLA_FFI=ON
      - name: build
        run: cmake --build build --config Release -j 4
      - name: test (every kernel variant)
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: python -m pip install ".[test]"
      - name: show backends
        run: python -c "import matfun, pprint; pprint.pprint(matfun.backends())"
      - name: test
        run: python -m pytest python/tests -v

  java:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21", "25"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: test
        working-directory: java
        run: mvn -B test
      - name: release artifacts (sources, javadoc; unsigned)
        if: matrix.java == '17'
        working-directory: java
        run: mvn -B -P release -Dgpg.skip verify

  julia:
    name: Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["1.10", "1"]
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - name: test
        run: julia --project=julia/MatFun -e 'using Pkg; Pkg.test()'

  cuda-build:
    name: CUDA ${{ matrix.cuda }} (build only)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cuda: ["13.0", "12.9"]
    steps:
      - uses: actions/checkout@v7
      # only nvcc and cudart from NVIDIA's apt repository: the CUDA docker images do not fit on the runner disk
      - name: nvcc
        env:
          V: ${{ matrix.cuda }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/cuda-keyring.deb" \
               https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i "$RUNNER_TEMP/cuda-keyring.deb"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "cuda-nvcc-${V/./-}" "cuda-cudart-dev-${V/./-}"
          echo "CUDACXX=/usr/local/cuda-$V/bin/nvcc" >> "$GITHUB_ENV"
      - name: build libmatfun_cuda for all wheel architectures
        run: |
          cmake -B build -DMATFUN_BUILD_CUDA=ON -DMATFUN_BUILD_TESTS=ON -DMATFUN_WITH_XLA_FFI=ON \
                -DCMAKE_CUDA_ARCHITECTURES="75-real;80-real;86-real;89-real;90-real;100-real;120"
          cmake --build build -j 4
